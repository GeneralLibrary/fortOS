# =============================================================================
# GNAS Debian 12 — Enabled Services Whitelist
# =============================================================================
# Only these systemd services are allowed to start at boot.
# ALL other services are masked/disabled by the trim script.
# =============================================================================

# --- GNAS Core ---
gnas.service                    # GNAS management API (primary service)

# --- Docker / Container Runtime ---
docker.service                  # Docker daemon (required for Agent orchestration)
containerd.service              # containerd (docker dependency)

# --- File Sharing (conditionally managed by GNAS) ---
smbd.service                    # Samba SMB daemon
nmbd.service                    # NetBIOS name server (Samba dependency)
nfs-server.service              # NFS kernel server
nfs-mountd.service              # NFS mount daemon
nfs-idmapd.service              # NFS idmap daemon
rpcbind.service                 # RPC port mapper (NFS dependency)
rpc-statd.service               # NFS status daemon
vsftpd.service                  # FTP server

# --- Core System (essential for any Linux system) ---
systemd-journald.service        # Journal logging
systemd-udevd.service           # Device manager
systemd-resolved.service        # DNS resolver
systemd-networkd.service        # Network management (fallback)
systemd-timesyncd.service       # Time synchronization
systemd-tmpfiles-setup.service  # Temp files setup
systemd-logind.service          # Login manager
ssh.service                     # SSH server (remote admin)

# --- Network ---
networking.service              # Network interfaces
NetworkManager.service          # Network Manager (primary)

# --- UPS ---
nut-monitor.service             # NUT UPS monitor
nut-client.service              # NUT client service

# --- Observability (optional, managed by docker-compose) ---
# loki.service                  # NOT enabled by default — runs in Docker if needed
