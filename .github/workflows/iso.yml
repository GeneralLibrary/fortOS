name: FortOS Debian ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in the ISO filename; 以 v 开头(如 v1.2.3)时,手动构建也会自动创建 tag + release 并发布 ISO
        required: true
        default: dev
      size_baseline:
        description: Baseline ISO size in bytes for the ≤300 MiB graphics-stack delta check (optional; empty records this build as reference)
        required: false
        default: ""
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate ISO configuration
        run: |
          bash -n eng/iso/build-local-wsl.sh eng/iso/verify-config.sh \
            eng/iso/test-image.sh eng/iso/test-boot.sh eng/iso/test-install.sh \
            eng/iso/verify-size.sh eng/iso/tests/installer-e2e.sh
          bash eng/iso/verify-config.sh

      # ------------------------------------------------------------------
      # 原生构建路径(与 build-iso.ps1 / build-local-wsl.sh 等价,无需 Docker):
      #   1. 前端 Dashboard 由 Vite 构建到 src/FortOS.Api/wwwroot/dashboard
      #      (gitignore 产物),必须先在 runner 上构建,否则 build-local-wsl.sh
      #      因缺 dashboard/index.html 直接报错;
      #   2. dotnet SDK 10 由 setup-dotnet 提供(build-local-wsl.sh 从 PATH 发现,
      #      也接受 /opt/dotnet);
      #   3. live-build/xorriso 等工具链用 apt 安装;.NET 宿主库(libicu/libssl/
      #      libunwind)也一并装上,因为 dotnet publish 在 runner 上运行;
      #   4. lb build 需要 root(chroot 挂载 /proc /sys),故用 sudo 运行,并通过
      #      env 显式保留 PATH(找到 dotnet)与 VERSION(产物命名/版本文件)。
      # ------------------------------------------------------------------
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/FortOS.Dashboard/package-lock.json

      - name: Build FortOS Dashboard frontend
        run: |
          cd src/FortOS.Dashboard
          npm ci
          npm run build

      - name: Install ISO build toolchain
        run: |
          sudo apt-get update
          # ubuntu-latest 现为 24.04(libicu74/libssl3t64);fallback 覆盖旧镜像包名
          sudo apt-get install -y --no-install-recommends \
            live-build xorriso squashfs-tools mtools dosfstools \
            debootstrap cpio isolinux syslinux-common \
            libicu74 libunwind8 libssl3t64 \
            || sudo apt-get install -y --no-install-recommends \
              live-build xorriso squashfs-tools mtools dosfstools \
              debootstrap cpio isolinux syslinux-common \
              libicu72 libunwind8 libssl3

      - name: Build Debian 12 installation image
        env:
          VERSION: ${{ inputs.version || github.event.release.tag_name || github.ref_name }}
        run: sudo env "PATH=$PATH" "VERSION=$VERSION" bash eng/iso/build-local-wsl.sh

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: fortos-debian12-amd64
          path: artifacts/iso/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Enforce ISO size budget
        # 体积护栏(设计稿 §8.5):首次构建记录基线,后续传 baseline-bytes 断言
        # 图形栈增量 ≤ 300 MiB。GitHub Actions 无跨运行状态,基线可取自
        # 上一次 release 的 ISO 大小(workflow 输入或手动传递)。
        shell: bash
        run: |
          iso="$(find artifacts/iso -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "${iso}"
          bash eng/iso/verify-size.sh "${iso}" "${{ inputs.size_baseline }}"

      - name: Check GitHub release asset size
        if: github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && startsWith(inputs.version, 'v'))
        shell: bash
        run: |
          iso="$(find artifacts/iso -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "${iso}"
          size="$(stat --format='%s' "${iso}")"
          if (( size >= 2147483648 )); then
            echo "::error::${iso} is ${size} bytes; GitHub release assets must be smaller than 2 GiB."
            exit 1
          fi

      - name: Publish image to GitHub release
        # 三条发布路径:① release published → 上传到已存在 release;
        # ② push v* tag → 创建/更新 release;③ 手动触发且 version 以 v 开头
        # → 按 version 创建 tag + release 并上传(dev 等非 v 开头只出 artifacts)。
        if: github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && startsWith(inputs.version, 'v'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ inputs.version || github.event.release.tag_name || github.ref_name }}"
          max_attempts=5
          for attempt in $(seq 1 "${max_attempts}"); do
            if gh release view "${tag}" >/dev/null 2>&1; then
              gh release upload "${tag}" artifacts/iso/* --clobber && exit 0
            else
              gh release create "${tag}" artifacts/iso/* --title "${tag}" --generate-notes && exit 0
            fi
            if (( attempt == max_attempts )); then
              echo "::error::Failed to publish ISO assets after ${max_attempts} attempts."
              exit 1
            fi
            echo "::warning::Publish attempt ${attempt}/${max_attempts} failed. Retrying..."
            sleep $(( attempt * 5 ))
          done

  smoke-boot:
    name: Boot smoke test (BIOS + UEFI → FortOS GUI)
    needs: build-iso
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fortos-debian12-amd64
          path: artifacts/iso

      - name: Install QEMU and ISO tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf xorriso squashfs-tools

      - name: Validate ISO image contents
        run: |
          iso="$(find artifacts/iso -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "${iso}"
          bash eng/iso/test-image.sh "${iso}"

      - name: Boot test — BIOS (isolinux)
        run: |
          iso="$(find artifacts/iso -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "${iso}"
          bash eng/iso/test-boot.sh "${iso}" bios artifacts/boot-bios

      - name: Boot test — UEFI (grub)
        run: |
          iso="$(find artifacts/iso -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "${iso}"
          bash eng/iso/test-boot.sh "${iso}" uefi artifacts/boot-uefi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-test-results
          path: artifacts/boot-*
