name: FortOS Debian ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in the ISO filename; 以 v 开头(如 v1.2.3)时,手动构建也会自动创建 tag + release 并发布 ISO
        required: true
        default: dev
      size_baseline:
        description: Baseline amd64 ISO size in bytes for the ≤300 MiB graphics-stack delta check (optional; empty records this build as reference)
        required: false
        default: ""
      size_baseline_arm64:
        description: Baseline arm64 ISO size in bytes for the ≤300 MiB graphics-stack delta check (optional; empty records this build as reference)
        required: false
        default: ""
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-iso:
    # amd64 在 x64 runner 上原生构建;arm64 在 GitHub 原生 ARM64 runner
    # (ubuntu-24.04-arm) 上原生构建,无需 qemu 模拟,与 amd64 完全同构。
    # 两个 job 都会把产物发布到同一个 tag 的 release(文件名带架构后缀,
    # 不冲突;并发 create/upload 竞争由 Publish 步骤的现有重试逻辑兜底)。
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            artifact: fortos-debian12-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            artifact: fortos-debian12-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate ISO configuration
        run: |
          bash -n eng/iso/build-local-wsl.sh eng/iso/verify-config.sh \
            eng/iso/test-image.sh eng/iso/test-boot.sh eng/iso/test-install.sh \
            eng/iso/verify-size.sh eng/iso/tests/installer-e2e.sh
          bash eng/iso/verify-config.sh

      # ------------------------------------------------------------------
      # 原生构建路径(与 build-iso.ps1 / build-local-wsl.sh 等价,无需 Docker):
      #   1. 前端 Dashboard 由 Vite 构建到 src/FortOS.Api/wwwroot/dashboard
      #      (gitignore 产物),必须先在 runner 上构建,否则 build-local-wsl.sh
      #      因缺 dashboard/index.html 直接报错;
      #   2. dotnet SDK 10 由 setup-dotnet 提供(build-local-wsl.sh 从 PATH 发现,
      #      也接受 /opt/dotnet);
      #   3. live-build/xorriso 等工具链用 apt 安装;.NET 宿主库(libicu/libssl/
      #      libunwind)也一并装上,因为 dotnet publish 在 runner 上运行;
      #   4. lb build 需要 root(chroot 挂载 /proc /sys),故用 sudo 运行,并通过
      #      env 显式保留 PATH(找到 dotnet)与 VERSION/ARCHITECTURE(产物命名/
      #      版本文件/目标架构)。
      # ------------------------------------------------------------------
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/FortOS.Dashboard/package-lock.json

      - name: Build FortOS Dashboard frontend
        run: |
          cd src/FortOS.Dashboard
          npm ci
          npm run build

      - name: Install ISO build toolchain
        run: |
          sudo apt-get update
          # ubuntu-latest/ubuntu-24.04-arm 现为 24.04(libicu74/libssl3t64);fallback 覆盖旧镜像包名
          sudo apt-get install -y --no-install-recommends \
            live-build xorriso squashfs-tools mtools dosfstools \
            debootstrap cpio isolinux syslinux-common \
            libicu74 libunwind8 libssl3t64 \
            || sudo apt-get install -y --no-install-recommends \
              live-build xorriso squashfs-tools mtools dosfstools \
              debootstrap cpio isolinux syslinux-common \
              libicu72 libunwind8 libssl3
          # Ubuntu 24.04 ships a 2012-era live-build (3.0~a57-1) that hardcodes
          # Debian 2.6-era debian-installer package names (linux-image-2.6-amd64,
          # lilo) and predates bookworm features. Replace it with the Debian
          # bookworm live-build (1:20230502), which is built for bookworm and
          # supports --uefi-secure-boot. Its only hard Depends is debootstrap,
          # already installed above (version 1:20230502 > 3.0~a57-1ubuntu49, so
          # dpkg -i treats this as an upgrade).
          curl -fsSL -o /tmp/live-build.deb \
            https://deb.debian.org/debian/pool/main/l/live-build/live-build_20230502_all.deb
          sudo dpkg -i /tmp/live-build.deb

      - name: Build Debian 12 installation image (${{ matrix.arch }})
        env:
          VERSION: ${{ inputs.version || github.event.release.tag_name || github.ref_name }}
          ARCHITECTURE: ${{ matrix.arch }}
        run: sudo env "PATH=$PATH" "VERSION=$VERSION" "ARCHITECTURE=$ARCHITECTURE" bash eng/iso/build-local-wsl.sh

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/iso/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Enforce ISO size budget
        # 体积护栏(设计稿 §8.5):首次构建记录基线,后续传 baseline-bytes 断言
        # 图形栈增量 ≤ 300 MiB。GitHub Actions 无跨运行状态,基线可取自
        # 上一次 release 的 ISO 大小(workflow 输入或手动传递);两个架构各自
        # 独立记录基线(size_baseline / size_baseline_arm64)。
        shell: bash
        run: |
          iso="$(find artifacts/iso -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "${iso}"
          if [[ "${{ matrix.arch }}" == "amd64" ]]; then
            baseline="${{ inputs.size_baseline }}"
          else
            baseline="${{ inputs.size_baseline_arm64 }}"
          fi
          bash eng/iso/verify-size.sh "${iso}" "${baseline}"

      - name: Check GitHub release asset size
        if: github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && startsWith(inputs.version, 'v'))
        shell: bash
        run: |
          iso="$(find artifacts/iso -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "${iso}"
          size="$(stat --format='%s' "${iso}")"
          if (( size >= 2147483648 )); then
            echo "::error::${iso} is ${size} bytes; GitHub release assets must be smaller than 2 GiB."
            exit 1
          fi

      - name: Publish image to GitHub release
        # 三条发布路径:① release published → 上传到已存在 release;
        # ② push v* tag → 创建/更新 release;③ 手动触发且 version 以 v 开头
        # → 按 version 创建 tag + release 并上传(dev 等非 v 开头只出 artifacts)。
        # amd64 与 arm64 两个 matrix job 并发执行本步骤:文件名带架构后缀互不
        # 覆盖;若两者都发现 release 不存在而同时 create,失败的一方会在下一轮
        # 重试中 view 到已创建的 release 并转为 upload。
        if: github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && startsWith(inputs.version, 'v'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ inputs.version || github.event.release.tag_name || github.ref_name }}"
          max_attempts=5
          for attempt in $(seq 1 "${max_attempts}"); do
            if gh release view "${tag}" >/dev/null 2>&1; then
              gh release upload "${tag}" artifacts/iso/* --clobber && exit 0
            else
              gh release create "${tag}" artifacts/iso/* --title "${tag}" --generate-notes && exit 0
            fi
            if (( attempt == max_attempts )); then
              echo "::error::Failed to publish ISO assets after ${max_attempts} attempts."
              exit 1
            fi
            echo "::warning::Publish attempt ${attempt}/${max_attempts} failed. Retrying..."
            sleep $(( attempt * 5 ))
          done

  smoke-boot:
    name: Boot smoke test (${{ matrix.arch }})
    needs: build-iso
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64:BIOS(isolinux)+ UEFI(grub)两条引导路径都要测
          - arch: amd64
            runner: ubuntu-latest
            artifact: fortos-debian12-amd64
            firmware: "bios uefi"
          # arm64:纯 UEFI 引导(无 BIOS/grub-pc),只测 UEFI
          - arch: arm64
            runner: ubuntu-24.04-arm
            artifact: fortos-debian12-arm64
            firmware: "uefi"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/iso

      - name: Install QEMU and ISO tooling
        run: |
          sudo apt-get update
          if [[ "${{ matrix.arch }}" == "amd64" ]]; then
            sudo apt-get install -y --no-install-recommends \
              qemu-system-x86 qemu-utils ovmf xorriso squashfs-tools
          else
            sudo apt-get install -y --no-install-recommends \
              qemu-system-arm qemu-utils qemu-efi-aarch64 xorriso squashfs-tools
          fi

      - name: Validate ISO image contents
        run: |
          iso="$(find artifacts/iso -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "${iso}"
          ARCH=${{ matrix.arch }} bash eng/iso/test-image.sh "${iso}"

      - name: Boot test — BIOS/UEFI (${{ matrix.arch }})
        run: |
          iso="$(find artifacts/iso -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "${iso}"
          for fw in ${{ matrix.firmware }}; do
            ARCH=${{ matrix.arch }} bash eng/iso/test-boot.sh "${iso}" "${fw}" "artifacts/boot-${fw}"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-test-results-${{ matrix.arch }}
          path: artifacts/boot-*
