name: GNAS CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate Debian ISO configuration
        run: |
          bash -n eng/iso/build.sh eng/iso/build-in-container.sh eng/iso/verify-config.sh
          bash eng/iso/verify-config.sh
      - run: dotnet restore GNAS.slnx
      - run: dotnet build GNAS.slnx -c Release --no-restore -warnaserror:CS
      - run: dotnet test GNAS.slnx -c Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Enforce line coverage floor
        shell: pwsh
        run: |
          # Current suite is integration-heavy; keep a pragmatic floor and tighten as unit coverage grows.
          $minimumLineRate = 0.18
          $report = Get-ChildItem TestResults -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1
          if (-not $report) { throw "Coverage report was not produced." }
          [xml]$coverage = Get-Content $report.FullName
          $lineRate = [double]::Parse($coverage.coverage.'line-rate', [Globalization.CultureInfo]::InvariantCulture)
          if ($lineRate -lt $minimumLineRate) { throw "Line coverage $lineRate is below the $minimumLineRate production gate." }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  docker-e2e:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'docker-e2e')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: docker compose -f docker-compose.test.yml up -d --build
      - run: dotnet test tests/GNAS.Tests.Integration/GNAS.Tests.Integration.csproj --filter "Category=Integration" --logger "trx;LogFileName=docker-e2e.trx" --results-directory TestResults
      - if: always()
        run: docker compose -f docker-compose.test.yml down --volumes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-e2e-results
          path: TestResults
