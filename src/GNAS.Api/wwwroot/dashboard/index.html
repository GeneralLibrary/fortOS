<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GNAS Dashboard</title><style>body{margin:0;background:#0f172a;color:#e2e8f0;font:14px system-ui,Segoe UI,sans-serif}header{padding:16px 24px;background:#111827;border-bottom:1px solid #334155}main{padding:20px;display:grid;gap:16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card,section{background:#111827;border:1px solid #334155;border-radius:10px;padding:14px}h1,h2{margin:0 0 10px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #334155;text-align:left}small{color:#94a3b8}.err{color:#f87171}</style></head><body><header><h1>GNAS Dashboard</h1><small id="stamp"></small></header><main><div class="cards"><div class="card"><h2>健康</h2><div id="health">Loading...</div></div><div class="card"><h2>告警</h2><div id="alerts">Loading...</div></div></div><section><h2>磁盘</h2><table><thead><tr><th>路径</th><th>型号</th><th>容量</th><th>SMART</th><th>温度</th></tr></thead><tbody id="disks"></tbody></table></section><section><h2>服务</h2><table><thead><tr><th>ID</th><th>状态</th><th>类型</th><th>内存</th></tr></thead><tbody id="services"></tbody></table></section><section><h2>Agent</h2><table><thead><tr><th>ID</th><th>名称</th><th>类型</th></tr></thead><tbody id="agents"></tbody></table></section></main><script>const $=id=>document.getElementById(id);function cell(tr,v){const td=document.createElement('td');td.textContent=v??'';tr.appendChild(td)}function rows(id,items,cols){const b=$(id);b.textContent='';(items||[]).forEach(x=>{const tr=document.createElement('tr');cols.forEach(c=>cell(tr,typeof c==='function'?c(x):x[c]));b.appendChild(tr)})}async function get(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}async function tick(){try{const [h,d,s,a,al]=await Promise.allSettled(['/api/health','/api/disks','/api/services','/api/agents','/api/alerts'].map(get));$('stamp').textContent=new Date().toLocaleString();$('health').textContent=h.status==='fulfilled'?`${h.value.status} uptime ${h.value.uptime}`:'Unavailable';$('alerts').textContent=al.status==='fulfilled'?`${al.value.length||0} active alerts`:'Unavailable';if(d.status==='fulfilled')rows('disks',d.value,['path','model',x=>x.sizeBytes,'smartStatus','temperatureCelsius']);if(s.status==='fulfilled')rows('services',s.value,['serviceId','status','type','memoryBytes']);if(a.status==='fulfilled')rows('agents',a.value,['serviceId','displayName','type'])}catch(e){$('health').textContent='Error '+e.message;$('health').className='err'}}tick();setInterval(tick,5000);</script></body></html>
