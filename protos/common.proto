syntax = "proto3";

package gnas.v1;
option csharp_namespace = "GNAS.Proto";

message EmptyRequest {}

message IdRequest {
  string id = 1;
}

message StatusResponse {
  bool success = 1;
  string message = 2;
  ErrorCode error_code = 3;
  string trace_id = 4;
}

message ErrorDetail {
  ErrorCode code = 1;
  string message = 2;
  string details = 3;
  string trace_id = 4;
  map<string, string> metadata = 5;
}

message PageRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message PageInfo {
  int32 total_count = 1;
  string next_page_token = 2;
  bool has_more = 3;
}

enum ErrorCode {
  ERROR_CODE_OK = 0;

  ERROR_CODE_UNKNOWN = 1000;
  ERROR_CODE_INVALID_ARGUMENT = 1001;
  ERROR_CODE_NOT_FOUND = 1002;
  ERROR_CODE_ALREADY_EXISTS = 1003;
  ERROR_CODE_PERMISSION_DENIED = 1004;
  ERROR_CODE_RESOURCE_EXHAUSTED = 1005;
  ERROR_CODE_INTERNAL_ERROR = 1006;
  ERROR_CODE_UNAVAILABLE = 1007;
  ERROR_CODE_TIMEOUT = 1008;

  ERROR_CODE_DISK_NOT_FOUND = 2001;
  ERROR_CODE_DISK_IN_USE = 2002;
  ERROR_CODE_DISK_IO_ERROR = 2003;
  ERROR_CODE_RAID_DEGRADED = 2004;
  ERROR_CODE_RAID_CREATE_FAILED = 2005;
  ERROR_CODE_FS_MOUNT_FAILED = 2006;
  ERROR_CODE_FS_FORMAT_FAILED = 2007;
  ERROR_CODE_POOL_FULL = 2008;

  ERROR_CODE_TOKEN_EXPIRED = 3001;
  ERROR_CODE_TOKEN_INVALID = 3002;
  ERROR_CODE_TOKEN_REVOKED = 3003;
  ERROR_CODE_CAPABILITY_INSUFFICIENT = 3004;
  ERROR_CODE_DATA_LEVEL_INSUFFICIENT = 3005;
  ERROR_CODE_ACCOUNT_LOCKED = 3006;
  ERROR_CODE_TPM_UNAVAILABLE = 3007;

  ERROR_CODE_AGENT_NOT_FOUND = 4001;
  ERROR_CODE_AGENT_DEPLOY_FAILED = 4002;
  ERROR_CODE_AGENT_START_FAILED = 4003;
  ERROR_CODE_AGENT_CRASH_LOOP = 4004;
  ERROR_CODE_COMPOSE_GENERATE_FAILED = 4005;
  ERROR_CODE_DOCKER_UNAVAILABLE = 4006;

  ERROR_CODE_SERVICE_NOT_FOUND = 5001;
  ERROR_CODE_SERVICE_DEPENDENCY_FAILED = 5002;
  ERROR_CODE_SERVICE_ALREADY_RUNNING = 5003;
  ERROR_CODE_CIRCULAR_DEPENDENCY = 5004;
  ERROR_CODE_SERVICE_STOP_FAILED = 5005;

  ERROR_CODE_SHARE_NOT_FOUND = 6001;
  ERROR_CODE_SHARE_CREATE_FAILED = 6002;
  ERROR_CODE_SHARE_DELETE_FAILED = 6003;
  ERROR_CODE_PROTOCOL_UNAVAILABLE = 6004;

  ERROR_CODE_NETWORK_INTERFACE_NOT_FOUND = 7001;
  ERROR_CODE_NETWORK_CONFIG_FAILED = 7002;
  ERROR_CODE_FIREWALL_RULE_FAILED = 7003;
  ERROR_CODE_DNS_CONFIG_FAILED = 7004;

  ERROR_CODE_BACKUP_TASK_NOT_FOUND = 8001;
  ERROR_CODE_BACKUP_FAILED = 8002;
  ERROR_CODE_SNAPSHOT_FAILED = 8003;
  ERROR_CODE_RESTORE_FAILED = 8004;

  ERROR_CODE_AUDIT_CHAIN_BROKEN = 9001;
  ERROR_CODE_LOG_QUERY_FAILED = 9002;
  ERROR_CODE_METRIC_WRITE_FAILED = 9003;
  ERROR_CODE_ALERT_RULE_INVALID = 9004;
}
