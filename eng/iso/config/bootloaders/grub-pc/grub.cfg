source /boot/grub/config.cfg
# 确保 5 s 后自动引导默认项;config.cfg 可能不含 timeout 或设为 0。
set timeout=5

# FortOS 图形安装向导:默认项,启动 live 环境,
# 由 fortos-installer.service 在 tty7 拉起 Xorg + openbox + Avalonia。
menuentry 'FortOS Graphical Installer' --hotkey=f {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry 'FortOS Graphical Installer (fail-safe mode)' {
	linux	@KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@
	initrd	@INITRD_LIVE@
}

# Debian Installer(备用路径:图形/文本/自动化,preseed 注入走 auto=true)
if @ENABLE_INSTALL_MENU@; then
	submenu 'Debian Installer (alternate)' --hotkey=a {

		source /boot/grub/theme.cfg

		source	/boot/grub/install.cfg

	}
fi

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Memtest (if any)
	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	# Verify the checksums
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
