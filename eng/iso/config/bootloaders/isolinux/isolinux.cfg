# FortOS BIOS boot configuration (isolinux).
#
# menu.c32 (text-mode menu) replaces vesamenu.c32 because QEMU TCG mode does
# not reliably initialise VBE/VESA graphics, which can stall the graphical
# menu module and prevent the auto-boot countdown from running.  On real
# hardware both modules work; text mode is chosen here for maximum
# compatibility with CI and bare-metal environments alike.
#
# timeout 50  → 5-second countdown before the default entry boots
# (SYSLINUX timeout unit is 1/10 s; 50 = 5 s).
include menu.cfg
default menu.c32
prompt 0
timeout 50
