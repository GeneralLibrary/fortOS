label installgui
	menu label ^Graphical Debian Installer
	linux @KERNEL_GI@
	initrd @INITRD_GI@
	append vga=788 @APPEND_INSTALL@ --- quiet

label installtext
	menu label ^Text Debian Installer
	linux @KERNEL_DI@
	initrd @INITRD_DI@
	append vga=788 @APPEND_INSTALL@ --- quiet

label installauto
	menu label ^Automated (preseed) install
	linux @KERNEL_GI@
	initrd @INITRD_GI@
	append auto=true priority=critical vga=788 @APPEND_INSTALL@ --- quiet
